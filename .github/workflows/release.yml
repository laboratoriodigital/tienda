# Cortar una versión de la plantilla.
#
# Esto NO despliega ninguna tienda hija. Publica una versión con nombre para
# que las tiendas puedan pedirla: la flota por anillos (`tiendas` › flota ›
# actualizar) o cada tienda con `montaje` › semilla (también desde el menú de
# su hoja o el panel). Ninguna se mueve hasta que alguien lo pide.
# Lo único que sí toca es la PROPIA semilla, que también es una tienda: el
# último paso pone al día su maestro vivo si quedó atrás (bitácora 106).
#
# La versión se lee de package.json: es el único lugar donde vive. Súbela en
# la rama del cambio, fusiona, y entonces corre esto desde la pestaña Actions.
#
#   Los clientes piden la última con:
#   https://github.com/laboratoriodigital/tienda/releases/latest/download/index.html
name: release

on:
  workflow_dispatch:

# DE DÓNDE SALE LA PLANTILLA, ESCRITO UNA SOLA VEZ.
env:
  SEMILLA: laboratoriodigital/tienda

permissions:
  contents: write
  # write, no read: el último paso dispara `montaje` en la semilla cuando su
  # propio maestro quedó atrás (bitácora 106). workflow_dispatch es de los
  # pocos eventos que el permiso de Actions SÍ puede disparar.
  actions: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── LA FICHA DE LA CORRIDA (0.20.4 · bitácora 91) ─────────────────────
      # La misma de todos los flujos: qué es esto, sobre qué repositorio, cómo
      # está antes de tocar nada y qué se pidió. Una vez, arriba, y ningún paso
      # de abajo lo repite.
      - name: Qué es esta corrida
        run: |
          v=$(node -p "require('./package.json').version")
          ultima=$(git tag --list 'v*' --sort=-v:refname | head -1)
          {
            echo "## Cortar la versión $v de la semilla"
            echo ""
            echo "Esto **no despliega ninguna tienda**: publica una versión con nombre para que"
            echo "las tiendas puedan pedirla cuando les toque, cada una a su ritmo."
            echo ""
            echo "|  |  |"
            echo "|---|---|"
            echo "| Semilla | \`$GITHUB_REPOSITORY\` · \`${GITHUB_SHA:0:7}\` |"
            echo "| Se va a cortar | **$v** (de \`package.json\`) |"
            echo "| La última cortada | ${ultima:-ninguna todavía} |"
            echo "| Lo disparó | $GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── ESTE FLUJO NO ES DE UNA TIENDA ────────────────────────────────────
      # `release` corta la versión de la PLANTILLA. Una tienda no corta
      # versiones: nace de la plantilla y consume la suya. Pero el flujo viaja
      # dentro de la plantilla, así que aparece en la pestaña Actions de cada
      # tienda — invitando a correrlo, que es exactamente lo razonable cuando
      # alguien está comprobando el ciclo completo de una tienda nueva.
      #
      # Y cuando fallaba, el mensaje mandaba al sitio equivocado: «sube
      # `version` en package.json». En una tienda ese consejo es falso, y es el
      # patrón que cerró la tanda de la 2.10: un error que apunta al sitio
      # equivocado cuesta más que uno que no dice nada. Pasó dos veces.
      - name: ¿Este repositorio es la semilla?
        run: |
          if [ "$GITHUB_REPOSITORY" = "$SEMILLA" ]; then
            echo "Sí: $GITHUB_REPOSITORY. Adelante."
            exit 0
          fi
          {
            echo "### \`release\` no es un flujo de tienda"
            echo ""
            echo "Este repositorio es **\`$GITHUB_REPOSITORY\`**, y \`release\` corta la"
            echo "versión de la plantilla — eso solo se hace en **\`$SEMILLA\`**."
            echo ""
            echo "Una tienda no corta versiones: nace de la plantilla y consume la"
            echo "suya. Este flujo aparece aquí porque viaja dentro de la plantilla,"
            echo "no porque haga falta."
            echo ""
            echo "**Lo que sí se corre en una tienda:**"
            echo ""
            echo "| Para | Flujo |"
            echo "|---|---|"
            echo "| Traer lo que cambió en la hoja o en el Drive | \`montaje\` |"
            echo "| Lo mismo, desde el botón de la hoja del comercio | \`fotos\` |"
            echo "| Publicar \`maestro.gs\` | \`montaje\` con \`maestro\` + \`PUBLICAR\` |"
            echo ""
            echo "No se rompió nada: este flujo paró antes de tocar el repositorio."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::release corta la versión de la plantilla y este repositorio no es $SEMILLA."
          exit 1

      # NADA SE PUBLICA SIN TODAS LAS BATERÍAS EN VERDE — pero no se corren dos
      # veces. El push a main ya corrió la suite completa sobre ESTE commit;
      # aquí se le pregunta a GitHub por esa corrida en vez de repetirla. Si
      # todavía corre, se espera; si no existe o falló, no se corta nada.
      # (Idea de la línea anterior: release pasó de minutos a segundos.)
      - name: Las baterías de este commit, en verde
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for intento in $(seq 1 30); do
            corridas=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pruebas.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=10")
            verdes=$(echo "$corridas" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')
            activas=$(echo "$corridas" | jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$verdes" -gt 0 ]; then echo "La suite completa de $GITHUB_SHA ya está en verde."; exit 0; fi
            if [ "$activas" -eq 0 ] && [ "$intento" -gt 3 ]; then
              {
                echo "### No hay baterías en verde para este commit"
                echo ""
                echo "\`release\` no corta una versión cuyo código no pasó \`pruebas\`."
                echo "Haz push a main, espera a que \`pruebas\` termine en verde y vuelve a correr esto."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Este commit no tiene una corrida de pruebas por push en verde."
              exit 1
            fi
            echo "Esperando las pruebas de $GITHUB_SHA ($intento/30)…"
            sleep 10
          done
          echo "::error::Las pruebas de este commit no terminaron en cinco minutos."
          exit 1

      - name: Leer la versión
        id: v
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # UNA CRUZ ROJA QUE SIGNIFICA "TODO BIEN" ES PEOR QUE NO AVISAR: enseña a
      # ignorar las cruces rojas. Antes, volver a disparar esto sin haber
      # cambiado nada fallaba, y eso no es un error — es que no hay nada que
      # cortar. Lo que SÍ es un error es que la etiqueta exista apuntando a otro
      # commit: ahí el código cambió y la versión no.
      - name: ¿Hay algo que cortar?
        id: hay
        run: |
          tag="v${{ steps.v.outputs.v }}"
          # En una etiqueta anotada, el sha del ref es el del objeto etiqueta;
          # el del commit está en la entrada pelada, la que termina en ^{}.
          sha=$(git ls-remote --tags origin "$tag^{}" | awk '{print $1}' | head -1)
          [ -z "$sha" ] && sha=$(git ls-remote --tags origin "$tag" | awk '{print $1}' | head -1)

          if [ -z "$sha" ]; then
            echo "corta=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$sha" = "$(git rev-parse HEAD)" ]; then
            {
              echo "### $tag ya está publicada, y es exactamente este commit"
              echo ""
              echo "No hay nada que cortar. Esto no es un fallo: es que ya está hecho."
              echo ""
              echo "Para publicar otra versión, sube \`version\` en \`package.json\`"
              echo "y vuelve. Se sube **solo cuando cambia algo que se despliega**:"
              echo "\`maestro.gs\`, \`panel.gs\` o \`publicar/index.html\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$tag ya está publicada en este mismo commit. Nada que hacer."
            echo "corta=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "### $tag ya existe, pero apunta a otro commit"
            echo ""
            echo "Cambió el código y la versión no. **Sube \`version\` en"
            echo "\`package.json\` antes de cortar otra**, o quien pida"
            echo "\`$tag\` se llevará algo distinto de lo que hay aquí."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$tag existe y apunta a $sha, no a este commit." >&2
          exit 1

      - name: Empaquetar lo que consume un cliente nuevo
        if: steps.hay.outputs.corta == 'si'
        run: |
          mkdir -p entrega
          cp publicar/index.html entrega/index.html
          cp maestro.gs          entrega/maestro.gs
          cp panel.gs            entrega/panel.gs
          tar -czf entrega/publicar.tar.gz -C publicar .

      # ── CÓMO QUEDÓ (0.20.4 · bitácora 91) ────────────────────────────────
      # Un release en verde no decía NADA en el resumen: solo hablaban los
      # caminos rojos. Quien lo corre para poner una versión a disposición de la
      # flota tenía que ir a la pestaña Releases a comprobar que pasó.
      - name: Etiqueta y publicación
        if: steps.hay.outputs.corta == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.v }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.v.outputs.v }}" \
            --generate-notes \
            entrega/index.html entrega/maestro.gs entrega/panel.gs \
            entrega/publicar.tar.gz
          {
            echo ""
            echo "### \`v${{ steps.v.outputs.v }}\` cortada"
            echo ""
            echo "Ya se puede pedir: **flota › actualizar** para la flota entera, o"
            echo "**montaje › semilla** en una tienda. Quien no pida nada se queda como está."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── LA SEMILLA TAMBIÉN ES UNA TIENDA (0.22.3 · bitácora 106) ──────────
      # A una hija, su actualización le publica el maestro nuevo. La semilla
      # cambia por push y nadie se lo publicaba: su tienda viva se quedaba en el
      # maestro anterior hasta que «Publicar ahora» chocaba con «EL MAESTRO
      # PUBLICADO CONTESTA LA VERSIÓN …». Aquí se le pregunta al maestro vivo y,
      # si no es el de este commit, se dispara `montaje` con la casilla del
      # maestro y PUBLICAR: lo mismo que haría una persona. Corre también
      # cuando no hay nada que cortar: volver a correr `release` pone al día
      # una semilla que quedó atrás, y si ya está al día no hace nada.
      - name: El maestro de la semilla, al día
        env:
          GH_TOKEN: ${{ github.token }}
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          if [ -z "$MAESTRO_URL" ] || [ -z "$MAESTRO_TOKEN" ]; then
            {
              echo ""
              echo "### El maestro de la semilla: sin comprobar"
              echo ""
              echo "Faltan los secretos \`MAESTRO_URL\` y \`MAESTRO_TOKEN\` en este repositorio."
              echo "Si \`maestro.gs\` cambió, publícalo con **montaje** marcando la casilla del maestro y PUBLICAR."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! salida=$(node montar/preparar-index.mjs --al-dia 2>&1); then
            {
              echo ""
              echo "### El maestro de la semilla: no contestó"
              echo ""
              echo "La versión está cortada. No se pudo preguntar al maestro vivo; si \`maestro.gs\`"
              echo "cambió, publícalo con **montaje** marcando la casilla del maestro y PUBLICAR."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$salida" | tail -5
            exit 0
          fi
          repo=$(echo "$salida" | sed -n 's/^repo=//p')
          viva=$(echo "$salida" | sed -n 's/^viva=//p')
          if [ "$(echo "$salida" | sed -n 's/^desalineado=//p')" != "si" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "El maestro de la semilla ya es el de este commit (\`$viva\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run montaje.yml --ref "${GITHUB_REF_NAME}" \
            -f maestro=true -f confirmar=PUBLICAR -f que=todo
          {
            echo ""
            echo "### El maestro de la semilla quedó atrás: se publica"
            echo ""
            echo "La tienda de la semilla contesta \`$viva\` y este commit trae \`$repo\`."
            echo "Se disparó **montaje** con la casilla del maestro y PUBLICAR; su corrida está en Actions."
          } >> "$GITHUB_STEP_SUMMARY"
