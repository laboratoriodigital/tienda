# MONTAR LA TIENDA, TODO DE UNA. Un solo flujo, un solo botón.
#
# Antes esto eran dos: `montaje` traía la hoja y las fotos, y `maestro`
# publicaba el backend. Dispararlos por separado y en el orden equivocado es
# fácil y silencioso: si se publica un maestro nuevo DESPUÉS de escribir el
# index, la tienda queda avisando que la versión de la hoja no es la que espera.
# Aquí el orden está fijo y no depende de que nadie se acuerde.
#
#   1. maestro.gs   →  opcional, y hay que escribir PUBLICAR
#   2. index.html   →  el <head> y las 5 constantes, desde la hoja
#   3. fotos        →  las nuevas del Drive del comercio, ya convertidas
#   4. todas las baterías, SOBRE LOS ARCHIVOS YA MODIFICADOS
#   5. publicar en main
#
# EL PASO 4 ES EL QUE JUSTIFICA EL ORDEN. Los pasos 2 y 3 escriben dentro de
# index.html a partir de lo que el comercio puso en su hoja. Si esa
# configuración produce algo que rompe la tienda —una plantilla de fotos mal
# escrita, un color que no es un color—, es mejor enterarse aquí que en la vista
# previa del pull request.
#
# LA CONFIGURACIÓN SE ESCRIBE EN LA HOJA, no en este formulario. La pestaña
# Configuración es el sitio: se ve entera, se corrige sin disparar nada y el
# comercio la entiende. Este flujo la lee, no la pide.
#
# ═══ SECRETOS ═══
# Settings > Secrets and variables > Actions > New repository secret.
# Son los de ESTA tienda y de ninguna otra: cada tienda tiene su repositorio,
# así que no hay llavero común.
#
#   Siempre:
#     MAESTRO_URL     https://script.google.com/macros/s/AAA.../exec
#     MAESTRO_TOKEN   tk-...
#     Los dos salen del menú de la hoja > Diagnóstico. Lo que ese token permite
#     está acotado: leer la configuración, listar la carpeta de fotos y bajar
#     archivos DE ESA CARPETA. No borra, no escribe en la hoja, no alcanza el
#     resto del Drive.
#
#   Solo si se va a publicar el maestro desde aquí:
#     CLASPRC     el contenido de ~/.clasprc.json tras `clasp login` con la
#                 cuenta de ESTA tienda. Es una credencial de Google con
#                 permiso sobre su Apps Script y su Drive: por eso publicar
#                 pide confirmación escrita y nunca corre por horario.
#                 NO HACE FALTA UN EQUIPO PARA CREARLA: `clasp login
#                 --no-localhost` imprime una dirección y pide el código de
#                 vuelta, así que sirve desde cualquier terminal, incluido uno
#                 en el navegador. Es una vez por tienda.
#     SCRIPT_ID   el id del proyecto del maestro: en su URL, entre /projects/
#                 y /edit
#     HOJA_ID     el id de la hoja: en su URL, entre /d/ y /edit. SIN ESTO NO
#                 SE SUBE NADA: el archivo del repositorio lo lleva vacío, y un
#                 maestro sin hoja se ve perfecto y no registra un solo pedido.
#
# Si faltan los tres últimos, el paso del maestro se salta y lo dice. Los otros
# dos pasos siguen.
name: montaje

on:
  schedule:
    # Lunes 11:00 UTC = 6:00 en Colombia, antes de que abra el comercio.
    - cron: '0 11 * * 1'
  workflow_dispatch:
    inputs:
      que:
        description: 'Qué traer de la hoja y del Drive'
        type: choice
        default: todo
        options: [todo, solo-la-hoja, solo-las-fotos]
      maestro:
        description: '¿Publicar también maestro.gs? Marca esto Y escribe PUBLICAR abajo'
        type: boolean
        default: false
      confirmar:
        description: 'Escribe PUBLICAR solo si marcaste la casilla de arriba'
        required: false
      aprobacion:
        description: 'Cómo publicar lo que salga'
        type: choice
        default: automatica
        options: [automatica, con-pull-request]
      sin_guardia:
        description: 'Saltarse el guardia del presupuesto de tiempo (corrida excepcional)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # Para preguntar si el código de main ya pasó la suite completa (publicacion.sh).
  actions: read

# Nunca a la vez que `fotos`: los dos escriben en publicar/.
concurrency:
  group: tienda-${{ github.repository }}
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # LA CACHÉ DE NPM, A MANO Y NO CON `cache: npm`.
      # `cache: npm` exige un package-lock.json, y en este repositorio los dos
      # están en .gitignore: en un checkout limpio no existen, y setup-node se
      # cae con «Some specified paths were not resolved». Cachear ~/.npm no
      # necesita lockfile y se lleva lo que de verdad pesa, que es el binario
      # nativo de sharp.
      - name: Caché de npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'pruebas/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      # ── EL SITIO TIENE QUE TENER NOMBRE PROPIO (A-3) ──
      # No habla con el maestro, así que corre siempre, incluso antes de que
      # existan los secretos: un repositorio creado desde la plantilla y
      # empujado sin pasar por `npm run tienda` deja wrangler.jsonc con el
      # marcador de la semilla, y dos sitios con ese mismo nombre son el
      # MISMO Worker en Cloudflare para quien tenga más de una tienda en la
      # misma cuenta.
      - name: ¿El sitio de Cloudflare tiene nombre propio?
        run: node montar/revisar-worker.mjs

      - name: ¿Está configurada esta tienda?
        id: hay
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          if [ -z "$MAESTRO_URL" ] || [ -z "$MAESTRO_TOKEN" ]; then
            {
              echo "### Este repositorio no tiene la tienda configurada"
              echo ""
              echo "Faltan los secretos \`MAESTRO_URL\` y \`MAESTRO_TOKEN\`."
              echo "Salen del menú de la hoja > Diagnóstico, y se ponen en"
              echo "Settings > Secrets and variables > Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "sigue=no" >> "$GITHUB_OUTPUT"
          else
            echo "sigue=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencias
        if: steps.hay.outputs.sigue == 'si'
        run: npm ci --no-audit --no-fund

      # ── 0. ¿Es esta la tienda de este repositorio? ──
      # Aquí importa más que en `fotos`: este flujo reescribe el <head>, la
      # política de seguridad y SCRIPT_URL. Apuntado a la hoja equivocada, deja
      # una tienda pidiéndole el catálogo al maestro de otro comercio, y lo
      # hace en verde.
      # ── B-3 · UNA SOLA PREGUNTA AL MAESTRO ───────────────────────────────
      # Aquí la duplicada es `bloques`: la piden preparar-index y
      # preparar-compartir, cada una por su cuenta. Con el sondeo, las cinco
      # preguntas fijas de este flujo bajan a cuatro, y las cuatro salen A LA
      # VEZ en vez de una detrás de otra — que contra un Apps Script frío, con
      # 40 segundos de arranque documentados, es la diferencia que se nota.
      #
      # Caduca a los diez minutos, así que si el horneado de fotos se alarga,
      # las herramientas de abajo vuelven a preguntar solas. Y si el sondeo
      # falla entero, cada una pregunta lo suyo como siempre: por eso este paso
      # no puede tumbar la corrida.
      - name: Sondear el maestro, una vez
        if: steps.hay.outputs.sigue == 'si'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          node montar/sondear.mjs 2>&1 | tee /tmp/sondeo.txt || true
          {
            echo "### El sondeo"
            echo '```'
            cat /tmp/sondeo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ¿Esta hoja es la de esta tienda?
        if: steps.hay.outputs.sigue == 'si'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          set -o pipefail
          node montar/misma-tienda.mjs --desde 2>&1 | tee /tmp/misma.txt || estado=$?
          {
            echo "### De qué tienda es la hoja"
            echo '```'
            cat /tmp/misma.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${estado:-0}

      # ── 1. El backend, si se pidió ──
      # Va PRIMERO porque el paso 2 le pregunta al maestro cómo debe quedar el
      # <head>, y una de las cinco constantes es la versión del contrato. Al
      # revés, la tienda queda avisando que la hoja responde otra versión.
      - name: ¿Se pidió publicar el maestro?
        id: quiere
        if: steps.hay.outputs.sigue == 'si'
        env:
          CLASPRC: ${{ secrets.CLASPRC }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          HOJA_ID: ${{ secrets.HOJA_ID }}
        run: |
          if [ "${{ inputs.maestro }}" != "true" ]; then
            echo "publica=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ inputs.confirmar }}" != "PUBLICAR" ]; then
            echo "Marcaste publicar el maestro pero no escribiste PUBLICAR." >&2
            echo "Publicar el backend deja código nuevo atendiendo pedidos: se" >&2
            echo "confirma a propósito. No toqué nada." >&2
            exit 1
          fi
          # Un fallo tiene que decir QUÉ HACER, no solo qué falta, y decirlo en el
          # resumen, que es lo que alguien lee. Lo mismo que el botón del
          # carrito: quedarse callado cuesta más que el propio fallo.
          faltan=""
          for s in CLASPRC SCRIPT_ID HOJA_ID; do [ -z "${!s}" ] && faltan="$faltan $s"; done
          if [ -n "$faltan" ]; then
            {
              echo "### No publiqué el maestro: faltan secretos"
              echo ""
              echo "Falta:\`$faltan\`. Se ponen una sola vez, en"
              echo "**Settings → Secrets and variables → Actions**."
              echo ""
              echo "| Secreto | De dónde sale |"
              echo "| --- | --- |"
              echo "| \`HOJA_ID\` | La URL de la hoja, lo que va entre \`/d/\` y \`/edit\` |"
              echo "| \`SCRIPT_ID\` | La URL del proyecto del maestro, entre \`/projects/\` y \`/edit\` |"
              echo "| \`CLASPRC\` | El contenido de \`.clasprc.json\` que deja \`clasp login --no-localhost\` con la cuenta de ESTA tienda. Sirve desde cualquier terminal, también uno en el navegador |"
              echo ""
              echo "**No toqué nada.** El montaje se detuvo antes de escribir el"
              echo "\`index.html\`, a propósito: si el maestro no se publica, el index"
              echo "quedaría escrito contra la versión anterior."
              echo ""
              echo "**Mientras tanto**, para seguir sin esos secretos: vuelve a"
              echo "dispararme con la casilla \`maestro\` **sin marcar** —eso trae la"
              echo "hoja y las fotos— y publica el maestro **pegándolo en el editor"
              echo "de Apps Script**, que no necesita ni secretos ni equipo."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Faltan secretos:$faltan — ver el resumen de esta corrida." >&2
            exit 1
          fi
          echo "publica=si" >> "$GITHUB_OUTPUT"

      - name: clasp y la sesión de Google de esta tienda
        if: steps.quiere.outputs.publica == 'si'
        env:
          CLASPRC: ${{ secrets.CLASPRC }}
        run: |
          # SE MIRA QUÉ HAY EN EL SECRETO ANTES DE DÁRSELO A CLASP.
          # Montando la segunda tienda, aquí se pegó un `.clasp.json` —el que
          # dice a qué proyecto subir— en vez de un `~/.clasprc.json` —las
          # credenciales—. clasp contestó «No credentials found», que es cierto
          # y no ayuda: la pregunta no es dónde están las credenciales, sino qué
          # hay en su lugar. Y nuestro propio mensaje de error listaba «las dos
          # causas de siempre», que no eran ninguna de las dos.
          node montar/revisar-clasprc.mjs
          npm i -g @google/clasp@3
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      # La misma herramienta que corre en el equipo: repone el HOJA_ID antes de
      # subir, se niega a subir si no lo sabe, actualiza la implementación que ya
      # existe sin estrenar URL, y al terminar pregunta ?a=bloques para
      # comprobar que el maestro publicado ABRE SU HOJA.
      - name: Publicar maestro.gs
        if: steps.quiere.outputs.publica == 'si'
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          HOJA_ID: ${{ secrets.HOJA_ID }}
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          set -o pipefail   # sin esto manda el código de tee y un fallo se pierde
          node montar/publicar-maestro.mjs | tee /tmp/maestro.txt
          {
            echo '### Maestro'
            echo '```'
            cat /tmp/maestro.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 2. Lo que dice la hoja ──
      - name: El <head> y las constantes, desde la hoja
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
          # Si el maestro se publicó en esta corrida, hasta tres minutos para
          # que Google lo sirva (bitácora 57). Si no, cero: no hay qué esperar.
          ESPERAR_MAESTRO_S: ${{ steps.quiere.outputs.publica == 'si' && '180' || '0' }}
        # Se para ANTES de escribir si el maestro vivo no es el del
        # repositorio, y dice qué casilla marcar (bitácora 56). Ese mensaje va
        # al resumen: es lo primero que se lee de una corrida roja.
        run: |
          set -o pipefail
          node montar/preparar-index.mjs --desde 2>&1 | tee /tmp/index.txt || estado=$?
          if [ -n "$estado" ]; then
            {
              echo "### El index NO se horneó"
              echo '```'
              cat /tmp/index.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit ${estado:-0}

      # El panel del comerciante (D-2), con la dirección del maestro que acaba
      # de escribir el paso de arriba en el index — y de ningún otro sitio: la
      # tienda y su panel tienen que hablarle al MISMO maestro. Sin red.
      - name: El panel, con la misma dirección que la tienda
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        run: node montar/preparar-admin.mjs

      # La imagen que enseña WhatsApp al compartir el enlace (A-3): mismo
      # nombre y color que acaba de escribir el paso de arriba, así que va
      # justo después y con la misma condición.
      - name: La imagen para compartir, con el nombre y el color de la tienda
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: node montar/preparar-compartir.mjs --desde

      # ── 3. Lo que el comercio subió a su Drive ──
      - name: Las fotos nuevas
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-la-hoja'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: node montar/traer-fotos.mjs --desde

      # `git diff` NO VE LOS ARCHIVOS NUEVOS. Esto costó una corrida entera: el
      # montaje horneó catalogo.json por primera vez, este paso dijo "nada
      # cambió" —porque un archivo sin seguimiento no aparece en git diff— y el
      # trabajo se tiró a la basura con la corrida en verde. El fallo que
      # funciona, otra vez.
      #
      # `git add -A` primero, y la comparación contra el índice. Así un archivo
      # nuevo cuenta como cambio, que es lo que cualquiera esperaría que
      # significara "¿cambió algo?".
      # ── 3b. El catálogo, horneado dentro del sitio ──
      # VA DESPUÉS DE LAS FOTOS, y el orden es el arreglo. El catálogo lista qué
      # medidas existen de cada foto mirando la carpeta; si se hornea antes de
      # bajarlas, lista el disco de la corrida anterior y promete archivos que
      # todavía no están. Un manifiesto que se adelanta a lo que describe es
      # peor que no tenerlo: la página deja de adivinar para creerle a algo
      # equivocado.
      - name: El catálogo, horneado en el sitio
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        env:
          MAESTRO_URL: ${{ secrets.MAESTRO_URL }}
          MAESTRO_TOKEN: ${{ secrets.MAESTRO_TOKEN }}
        run: |
          set -o pipefail
          node montar/catalogo-estatico.mjs --desde 2>&1 | tee /tmp/catalogo.txt
          {
            echo "### El catálogo"
            echo '```'
            cat /tmp/catalogo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── LO QUE SE VE ANTES DE QUE CONTESTE NADIE ──────────────────────────
      # Va DESPUÉS de hornear, y no es un detalle de orden: el respaldo es una
      # copia del catalogo.json que el paso anterior acaba de escribir. Pedirle
      # el catálogo al maestro otra vez sería la segunda lectura del mismo dato
      # y, de las dos, una se queda atrás (patrón 2).
      #
      # Sin este paso el montaje dejaba la tienda escribiendo el <head>, las
      # constantes y la paleta de ESTE comercio, y el catálogo de respaldo del
      # comercio de la plantilla. Una tienda de cosméticos abría con ocho
      # tomates un instante — y se quedaba con ellos para siempre el día que
      # Google no contestara.
      #
      # El flujo `fotos` NO hace esto a propósito: lo que ese puede publicar
      # está acotado a `publicar/fotos` y `publicar/catalogo.json`, y el
      # index.html solo lo escribe este flujo. Los dos fusionan sin una persona
      # en medio; lo que separa a uno del otro es el alcance de lo que tocan,
      # no quién mira.
      - name: El respaldo del index, desde el catálogo recién horneado
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        run: |
          set -o pipefail
          node montar/sembrar-respaldo.mjs 2>&1 | tee /tmp/respaldo.txt
          {
            echo "### El respaldo del index.html"
            echo '```'
            cat /tmp/respaldo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── EL NOMBRE DEL WORKER, QUE ES LO ÚNICO QUE PUEDE PISAR A OTRA TIENDA ──
      # Dos tiendas con el mismo `name` en wrangler.jsonc son el mismo Worker en
      # Cloudflare: la segunda que despliegue PISA a la primera, y nada avisa —
      # las dos siguen desplegando en verde. Crear el repositorio desde la
      # plantilla y no acordarse de cambiarlo es el camino normal, no el raro.
      #
      # Hasta la historia A-3 esto solo lo arreglaba `npm run tienda`, con una
      # persona delante, y `DESPLIEGUE.md` lo compensaba con un aviso en negrita.
      # Un paso manual que hay que recordar es un paso que un día no se recuerda.
      #
      # Va DESPUÉS de hornear el catálogo porque el nombre del comercio sale de
      # ahí, no de una cuarta pregunta al maestro.
      # ── C-2 · EL SEO, HORNEADO COMO EL CATÁLOGO ──────────────────────────
      # Un rastreador no ejecuta JavaScript. Esta tienda pinta su catálogo desde
      # JavaScript, así que para Google la página era, literalmente, una
      # plantilla vacía: ni productos, ni precios, nada que indexar. El comercio
      # paga un dominio y no sale en ninguna búsqueda.
      #
      # Va DESPUÉS del catálogo y del respaldo: los datos estructurados salen de
      # publicar/catalogo.json, no de otra pregunta al maestro.
      - name: El SEO, desde el catálogo recién horneado
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        run: |
          set -o pipefail
          node montar/sembrar-seo.mjs 2>&1 | tee /tmp/seo.txt
          {
            echo "### El SEO horneado"
            echo '```'
            cat /tmp/seo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: El nombre del Worker, desde la hoja
        if: steps.hay.outputs.sigue == 'si' && inputs.que != 'solo-las-fotos'
        run: |
          set -o pipefail
          node montar/nombrar-worker.mjs 2>&1 | tee /tmp/worker.txt
          {
            echo "### El nombre del Worker"
            echo '```'
            cat /tmp/worker.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ¿Cambió algo?
        if: steps.hay.outputs.sigue == 'si'
        id: cambios
        run: |
          # LO QUE ESTE FLUJO PUBLICA, ESCRITO UNA SOLA VEZ. Lo leen el `git add`
          # y las comprobaciones de abajo; en dos copias, una se queda atrás.
          # wrangler.jsonc entra desde la historia A-3: el nombre del Worker lo
          # pone ahora el flujo, y si no se publicara no serviría de nada.
          PUBLICA="publicar/ wrangler.jsonc"
          git add -A -- $PUBLICA
          if git diff --cached --quiet -- $PUBLICA; then
            # UN "NO" TIENE QUE MOSTRAR SU TRABAJO. La primera vez que este paso
            # dijo "nada cambió" era mentira, y averiguar por qué costó ir a
            # buscar ramas al remoto. Ahora la respuesta trae consigo lo que
            # miró, así que la siguiente vez se lee en el resumen y ya.
            {
              echo "Nada cambió en la hoja ni en el Drive."
              echo ""
              echo "Esto es lo que hay en \`publicar/\`, por si el \"no\" sorprende:"
              echo '```'
              git status --porcelain -- $PUBLICA || true
              echo "(vacío = ni un archivo nuevo, ni uno modificado)"
              echo ""
              ls -la publicar/catalogo.json 2>&1 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### Cambió esto"
              echo '```'
              git diff --cached --stat -- $PUBLICA
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "hay=si" >> "$GITHUB_OUTPUT"

            # EL PULL REQUEST TIENE QUE DECIR QUÉ TRAE, y hasta ahora decía
            # siempre lo mismo. Un título que no cambia nunca es un título que
            # se deja de leer, y entonces da igual lo que haya dentro: se
            # fusiona por costumbre. Ya sabemos aquí qué cambió; que lo diga.
            fotos=$(git diff --cached --name-only -- 'publicar/fotos/*' \
                    | grep -v 'origen\.json' | wc -l | tr -d ' ')
            partes=""
            [ "$fotos" -gt 0 ] && partes="$fotos archivo(s) de foto"
            if ! git diff --cached --quiet -- publicar/index.html; then
              partes="${partes:+$partes · }la hoja (index.html)"
            fi
            if ! git diff --cached --quiet -- publicar/catalogo.json; then
              partes="${partes:+$partes · }el catálogo"
            fi
            if ! git diff --cached --quiet -- wrangler.jsonc; then
              partes="${partes:+$partes · }el nombre del Worker"
            fi
            [ -z "$partes" ] && partes="archivos de publicar/"
            echo "resumen=$partes" >> "$GITHUB_OUTPUT"

            # Y el detalle entero, para que el cuerpo del pull request lo lleve
            # sin que nadie tenga que abrir la pestaña de archivos.
            {
              echo 'detalle<<FIN_DEL_DETALLE'
              git diff --cached --stat -- $PUBLICA
              echo 'FIN_DEL_DETALLE'
            } >> "$GITHUB_OUTPUT"
          fi

      # ── 4. Probar lo que quedó escrito, NO lo que estaba antes ──
      - name: Caché del navegador
        id: navegador
        if: steps.cambios.outputs.hay == 'si'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # B-5 · LA CACHÉ QUE NO SE PIERDE ENTERA. La clave sale del
          # package-lock.json, que es lo que fija la versión EXACTA de
          # Playwright: con package.json, un rango `^1.47.0` que resuelve a una
          # versión nueva dejaba la clave igual y el navegador cacheado dejaba
          # de servir. Y `restore-keys` recupera la caché anterior cuando la
          # clave cambia: sin ella, subir una dependencia cualquiera tira a la
          # basura el navegador entero y hay que bajarlo de nuevo — minutos que
          # en un repositorio privado se pagan.
          #
          # La clave NO lleva la rama a propósito: una caché por rama multiplica
          # el almacenamiento, que en privado también se paga, y no protege de
          # nada porque la clave ya cambia cuando cambian las dependencias.
          key: playwright-${{ runner.os }}-${{ hashFiles('pruebas/package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Navegador para las pruebas
        if: steps.cambios.outputs.hay == 'si'
        run: |
          cd pruebas && npm ci --no-audit --no-fund
          # B-5 · LAS DEPENDENCIAS DEL SISTEMA, SOLO CUANDO HACEN FALTA.
          # `--with-deps` instala paquetes apt y tarda; con la caché acertada el
          # navegador ya está en su sitio y esa instalación no aporta nada.
          if [ "${{ steps.navegador.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      # SI ESTO FALLA, EL RESUMEN TIENE QUE DECIR QUÉ. Una corrida roja que
      # obliga a abrir el log, buscar el paso y desplegarlo es una corrida que
      # cuesta una conversación entera. Las líneas FALLA y el marcador van al
      # resumen, que es lo primero que se ve.
      - name: Las baterías sobre el archivo ya modificado
        if: steps.cambios.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cd pruebas
          # Solo las de lo publicado si el código ya pasó todas; si no, todas.
          ./publicacion.sh 2>&1 | tee /tmp/pruebas.txt || estado=$?
          {
            echo "### Las baterías"
            echo '```'
            grep -E "^ FALLA|^  TOTAL|Baterías con problemas|^    ·" /tmp/pruebas.txt || tail -30 /tmp/pruebas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${estado:-0}

      # ── 5. Y SE PUBLICA, DIRECTO EN main ──────────────────────────────────
      # ESTE FLUJO ABRÍA UN PULL REQUEST Y LO FUSIONABA EN EL MISMO SEGUNDO.
      # Parecía ceremonia inofensiva y era una X roja garantizada: un pull
      # request abierto por el bot dispara `pruebas`, y GitHub RETIENE esa
      # corrida esperando que un mantenedor la apruebe. Nadie la aprueba —el
      # flujo ya siguió solo—, caduca, y deja «This workflow run required
      # approval but was not approved before it expired» colgando de un pull
      # request que se fusionó perfectamente. Una marca roja que no significa
      # nada es peor que ninguna marca: enseña a no mirarlas.
      #
      # `fotos` aprendió esto y lo dejó escrito en su propio archivo. Este flujo
      # nunca recibió el arreglo: es el patrón 2 otra vez, la misma lección
      # viviendo en dos sitios y solo uno al día. Y la retención NO se esquiva
      # con una condición en `pruebas.yml`, porque es de la CORRIDA: pasa antes
      # de que se evalúe ninguna condición del trabajo.
      #
      # El plan lo dice sin rodeos (PLAN-MVP §4.7): «se hornea, se prueba y se
      # empuja a main sin que nadie apruebe nada». Las baterías ya corrieron
      # ENTERAS sobre estos mismos bytes, en el paso 4; el pull request no
      # añadía una sola comprobación.
      #
      # Las guardas que sí protegen siguen todas puestas: solo se indexa
      # `publicar/` —`git add -A -- publicar/`, así que no hay forma de que se
      # cuele otra cosa—, la identidad de la hoja se comprobó arriba, y ninguna
      # batería puede estar en rojo para llegar hasta aquí.
      #
      # Quien quiera el pull request lo pide: el formulario ya tiene la casilla
      # «Cómo publicar lo que salga», que hasta hoy no servía para nada.
      - name: Publicar en main
        if: steps.cambios.outputs.hay == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUMEN: ${{ steps.cambios.outputs.resumen }}
          DETALLE: ${{ steps.cambios.outputs.detalle }}
          AUTO: ${{ inputs.aprobacion != 'con-pull-request' }}
        run: |
          git config user.name  "montaje"
          git config user.email "noreply@github.com"
          git commit --quiet -m "refactor/frontend: $RESUMEN" -m "$DETALLE"

          if [ "$AUTO" = "true" ]; then
            if git push --quiet origin HEAD:main; then
              echo "Publicado en \`main\`. Cloudflare despliega solo." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # Si `main` está protegida, el push se rechaza y eso NO es un fallo:
            # es que este repositorio pide pull request. Se hace, y se dice.
            echo "::warning::No se pudo publicar directo en main; va por pull request."
            {
              echo "### Va por pull request"
              echo ""
              echo "El push directo a \`main\` se rechazó — normalmente porque la"
              echo "rama está protegida. No se perdió nada: queda el pull request."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # La rama lleva la hora: dos montajes seguidos rehacen los mismos
          # archivos generados, y con un nombre fijo el segundo choca contra la
          # rama del primero pase lo que pase.
          rama="montaje/desde-la-hoja-$(date +%Y%m%d-%H%M)"
          git push -u origin HEAD:"$rama"

          cuerpo="Lo que cambió el comercio desde su hoja y su carpeta de Drive."
          cuerpo+=$'\n\n### Qué trae\n```\n'
          cuerpo+="$DETALLE"
          cuerpo+=$'\n```\n\nTodas las baterías ya corrieron **sobre estos archivos**.'
          gh pr create --base main --head "$rama" \
            --title "montaje: $RESUMEN" --body "$cuerpo"
          echo "Pull request abierto: \`$rama\`." >> "$GITHUB_STEP_SUMMARY"

      # ── 6. Si publicar falló, DECIR POR QUÉ ──
      # GitHub contesta con un error de permisos en una anotación al pie, y para
      # verla hay que saber que existe. La respuesta va aquí, donde se ve el
      # fallo, y no en un runbook por el que este repositorio nunca pasó.
      - name: No se pudo publicar
        if: failure() && steps.cambios.outputs.hay == 'si'
        run: |
          {
            echo "### No se pudo publicar"
            echo ""
            echo "El trabajo NO se perdió: está en el artefacto de abajo."
            echo ""
            echo "Si el error habla de **permisos** o de **\`protected branch\`**,"
            echo "es una casilla de ESTE repositorio:"
            echo ""
            echo "> Settings → Actions → General → Workflow permissions →"
            echo "> **Read and write permissions** ✔"
            echo ""
            echo "Y si \`main\` está protegida y quieres que siga estándolo,"
            echo "dispara este flujo con **Cómo publicar lo que salga →"
            echo "con-pull-request**."
          } >> "$GITHUB_STEP_SUMMARY"

      # Lo que se horneó no se tira aunque el pull request falle. Ya pasó una
      # vez: el catálogo se generó bien y se perdió con el runner.
      - name: Guardar lo que se horneó, pase lo que pase
        if: always() && steps.cambios.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: publicar
          path: publicar/
          retention-days: 7

      # ── B-1 / B-6 · QUÉ SE LLEVÓ EL RELOJ, Y SI ESO CABE ─────────────────
      # No hay que instrumentar un solo paso: GitHub ya los cronometra todos y
      # lo publica en su API. Escribir un reloj a mano en treinta pasos serían
      # treinta sitios donde olvidarse de uno, y el que se olvida es justo el
      # que se come el tiempo (patrón 2).
      #
      # `always()` a propósito: cuando la corrida falla es cuando más importa
      # saber dónde se fue el tiempo. Y si la API no contesta, esto NO tumba la
      # corrida — medir es un servicio, no el trabajo.
      - name: Los tiempos
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIN_GUARDIA: ${{ inputs.sin_guardia && '1' || '0' }}
        run: |
          estado=0
          node montar/tiempos.mjs || estado=$?
          # La herramienta imprime y escribe tiempos.md; el flujo lo pega en
          # el resumen. Es como lo hacen todos los pasos de aquí, y deja que
          # A-8 pueda declarar lo que se escribe (una ruta que sale del
          # entorno no se puede declarar).
          [ -f tiempos.md ] && cat tiempos.md >> "$GITHUB_STEP_SUMMARY"
          exit $estado

      - name: Guardar los tiempos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiempos-${{ github.run_id }}
          path: tiempos.json
          retention-days: 30
          if-no-files-found: ignore
