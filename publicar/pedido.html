<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- EL RASTREO NO SE INDEXA, y la dirección no se le cuenta a nadie: lleva el
     secreto del pedido. noindex por si un buscador la encuentra; no-referrer
     para que un clic desde aquí no se la pase a otro sitio. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>TIENDA — tu pedido</title>
<style>
:root{--negro:#111;--tenue:#6E6E6E;--linea:#E4E4E4;--fondo:#F7F7F5;--blanco:#fff;--acento:#111;--verde:#14472B;--rojo:#B3261E;--radio:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--negro);min-height:100vh}
[hidden]{display:none!important}
.envoltura{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--blanco);border-bottom:1px solid var(--linea)}
header .envoltura{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:inherit;font-weight:700;text-decoration:none}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:20px;margin-top:16px}
h1{font-size:1.25rem;margin-bottom:4px}
.codigo{font-size:.8rem;letter-spacing:.08em;color:var(--tenue);font-weight:700}
.estado{font-size:1.1rem;font-weight:700;margin-top:10px}
.estado.cancelado{color:var(--rojo)}
.texto{color:var(--tenue);margin-top:2px}
ol.pasos{list-style:none;margin:18px 0 4px;padding:0}
ol.pasos li{position:relative;padding:0 0 16px 30px;color:var(--tenue)}
ol.pasos li::before{content:"";position:absolute;left:6px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--linea);background:var(--blanco)}
ol.pasos li::after{content:"";position:absolute;left:12px;top:18px;bottom:0;width:2px;background:var(--linea)}
ol.pasos li:last-child::after{display:none}
ol.pasos li.hecho{color:var(--negro)}
ol.pasos li.hecho::before{background:var(--acento);border-color:var(--acento)}
ol.pasos li.hecho::after{background:var(--acento)}
ol.pasos .fecha{display:block;font-size:.8rem;color:var(--tenue)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
td{padding:8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
td.n{text-align:right;white-space:nowrap;padding-left:10px}
.variante{display:block;font-size:.8rem;color:var(--tenue)}
.total td{font-weight:700;border-bottom:none}
.guia{margin-top:10px;font-size:.92rem}
.btn{display:inline-block;margin-top:16px;padding:12px 16px;border-radius:var(--radio);background:var(--acento);color:#fff;font-weight:700;text-decoration:none}
.btn.linea{background:none;color:var(--negro);border:1px solid var(--linea);margin-left:6px}
.nota{font-size:.8rem;color:var(--tenue);margin-top:14px}
.cargando{color:var(--tenue);margin-top:24px;text-align:center}
</style>
</head>
<body>
<header><div class="envoltura"><a href="/" id="marca">Tu tienda</a><span class="codigo">SEGUIMIENTO</span></div></header>
<main class="envoltura">
  <p class="cargando" id="cargando" role="status">Buscando tu pedido…</p>

  <section class="tarjeta" id="pedido" hidden aria-live="polite">
    <p class="codigo" id="codigo"></p>
    <h1>Tu pedido</h1>
    <p class="estado" id="estado"></p>
    <p class="texto" id="textoEstado"></p>
    <p class="guia" id="guia" hidden></p>
    <ol class="pasos" id="pasos"></ol>
    <table><tbody id="lineas"></tbody></table>
  </section>

  <section class="tarjeta" id="sinPedido" hidden>
    <h1>No encontramos tu pedido</h1>
    <p class="texto" id="motivo"></p>
  </section>

  <p id="acciones" hidden>
    <a class="btn" id="escribir" href="#" target="_blank" rel="noopener">Preguntar por WhatsApp</a>
    <a class="btn linea" href="/">Ir a la tienda</a>
  </p>
  <p class="nota" id="nota" hidden>Esta página no guarda ni pide ningún dato tuyo: muestra lo que la tienda anotó de tu pedido.
    Si otra persona tiene este enlace, puede ver lo mismo que tú.</p>
</main>

<script>
/* ============================================================================
   M5 · EL RASTREO DEL PEDIDO
   ----------------------------------------------------------------------------
   El comprador llega aquí con el enlace de su mensaje de WhatsApp:
   pedido.html?n=NÚMERO&s=SECRETO. La página hace UNA pregunta al maestro, por
   POST —el secreto no viaja en otra dirección más—, y pinta lo que contesta.
   No guarda nada en el navegador y no pide nada.

   Lo que viene de la hoja (nombres de producto, la guía) se pinta como texto.
   ============================================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXuK42kftKAue18ZtfHTBCQhTvPTTGNt7gtf-u08v4yIPtgQj2dvg-xNFbfQk3rpYDgQ/exec";
let NEGOCIO = "TIENDA";

const $ = s => document.querySelector(s);
const escapar = t => String(t == null ? "" : t)
  .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pesos = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-CO");
const fecha = iso => { const t = Date.parse(iso || ""); return t
  ? new Date(t).toLocaleString("es-CO", { day:"numeric", month:"long", hour:"numeric", minute:"2-digit" }) : ""; };

function ponerTienda(t){
  if (t && t.negocio) { NEGOCIO = t.negocio; }
  if (NEGOCIO) { $("#marca").textContent = NEGOCIO; document.title = "Tu pedido — " + NEGOCIO; }
  if (t && /^#[0-9a-f]{6}$/i.test(t.color || "")) document.documentElement.style.setProperty("--acento", t.color);
}

function acciones(t, pedido){
  const w = t && t.whatsapp;
  $("#escribir").hidden = !w;
  if (w) $("#escribir").href = "https://wa.me/" + encodeURIComponent(w) + "?text=" +
    encodeURIComponent(pedido ? "Hola, pregunto por mi pedido #" + pedido + "." : "Hola, pregunto por mi pedido.");
  $("#acciones").hidden = false;
}

function sinPedido(motivo, t){
  $("#cargando").hidden = true;
  $("#sinPedido").hidden = false;
  $("#motivo").textContent = motivo;
  ponerTienda(t);
  acciones(t, "");
}

function pintar(d){
  ponerTienda(d.tienda);
  $("#cargando").hidden = true;
  $("#pedido").hidden = false;
  $("#codigo").textContent = "PEDIDO #" + d.pedido;
  $("#estado").textContent = d.estado.rotulo;
  $("#estado").className = "estado " + d.estado.id;
  $("#textoEstado").textContent = d.estado.texto;
  $("#guia").hidden = !d.guia;
  $("#guia").textContent = d.guia ? "Guía del envío: " + d.guia : "";
  $("#pasos").innerHTML = (d.pasos || []).map(p =>
    `<li class="${p.hecho ? "hecho" : ""}">${escapar(p.rotulo)}${p.hecho && p.fecha ? `<span class="fecha">${escapar(fecha(p.fecha))}</span>` : ""}</li>`).join("");
  $("#lineas").innerHTML = d.lineas.map(l =>
    `<tr><td>${escapar(l.cantidad)} × ${escapar(l.nombre)}${l.variante ? `<span class="variante">${escapar(l.variante)}</span>` : ""}</td>` +
    `<td class="n">${pesos(l.subtotal)}</td></tr>`).join("") +
    `<tr class="total"><td>Total${d.pagoEnLinea ? " · pagado en línea" : ""}</td><td class="n">${pesos(d.total)}</td></tr>`;
  acciones(d.tienda, d.pedido);
  $("#nota").hidden = false;
}

(async function(){
  if (NEGOCIO) ponerTienda({});
  let n = "", s = "";
  try { const q = new URLSearchParams(location.search); n = (q.get("n") || "").trim(); s = (q.get("s") || "").trim(); } catch (e) {}
  if (!SCRIPT_URL) { sinPedido("Esta tienda todavía no está conectada.", null); return; }
  if (!n || !s) { sinPedido("Abre el enlace completo que quedó en tu mensaje de WhatsApp.", null); return; }
  try {
    const r = await fetch(SCRIPT_URL, { method: "POST", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ a: "seguimiento", n: n, s: s }) });
    const d = await r.json();
    if (d && d.ok) pintar(d);
    else sinPedido((d && d.error) || "No encontramos un pedido con ese enlace.", d && d.tienda);
  } catch (e) {
    sinPedido("No pudimos hablar con la tienda. Revisa tu conexión y vuelve a abrir el enlace.", null);
  }
})();
</script>
</body>
</html>
