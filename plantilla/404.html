<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[NOMBRE DE LA TIENDA — sin hornear] — esa página no existe</title>
<meta name="robots" content="noindex">
<style>
  :root{color-scheme:light;--tinta:#18181B;--suave:#5F6068;--linea:#E8E8EA;--acento:#18181B}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{display:grid;place-items:center;min-height:100svh;text-align:center;padding:24px;
       background:#F7F7F5;color:var(--tinta);font:400 16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:min(100%,440px);padding:36px 28px;border:1px solid var(--linea);border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(16,18,24,.04),0 1px 3px rgba(16,18,24,.06)}
  svg{width:64px;height:64px;color:var(--suave)}
  h1{font-size:1.5rem;line-height:1.2;letter-spacing:-.025em;font-weight:700;margin:18px 0 8px}
  p{color:var(--suave);margin:0 auto 24px;max-width:34ch}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;background:var(--acento);color:#fff;text-decoration:none;
    font-weight:650;padding:11px 22px;border-radius:999px;transition:background .15s,transform .15s}
  a:hover{background:#303036}
  a:active{transform:scale(.98)}
  a:focus-visible{outline:3px solid #7F56D9;outline-offset:3px}
  @media(max-width:420px){main{padding:30px 22px}}
  @media(prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
  <!-- Un signo de interrogación genérico, sin ningún color ni forma que
       identifique a un comercio en particular: esta página la ve cualquier
       visitante de cualquier tienda, así que no hay dato de negocio que
       hornear aquí más que el título de arriba. -->
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="29" fill="none" stroke="#B8B8B8" stroke-width="3.5"/>
    <text x="32" y="43" font-family="Arial, Helvetica, sans-serif" font-size="30"
          font-weight="700" fill="#B8B8B8" text-anchor="middle">?</text>
  </svg>
  <h1>Esa página no existe</h1>
  <p>Puede que el enlace esté incompleto o que el producto ya no esté publicado.</p>
  <a href="/">Ver el catálogo</a>
</main>
</body>
</html>
